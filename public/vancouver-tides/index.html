<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vancouver Tidal Grid</title>
<style>
  :root{
    --bg:#05060d; --water:#06122a; --cyan:#19f6ff; --mag:#ff2a8d; --purple:#9a6bff;
    --amber:#ffc24b; --ink:#0a1124;
    --font:'Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:#cfe9ff}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* CRT overlays */
  .scan{position:fixed;inset:0;pointer-events:none;z-index:6;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);
    mix-blend-mode:multiply;opacity:.5}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.7) 100%)}
  /* HUD */
  .hud{position:fixed;z-index:7;font-family:var(--mono);text-shadow:0 0 8px currentColor}
  .title{top:18px;left:22px;color:var(--cyan)}
  .title h1{font-size:15px;letter-spacing:.42em;font-weight:600}
  .title .sub{margin-top:5px;font-size:10px;letter-spacing:.28em;color:var(--mag);opacity:.85}
  .title .note{margin-top:3px;font-size:9px;letter-spacing:.16em;color:#5e7fb0}
  .readout{top:18px;right:22px;text-align:right;color:var(--cyan)}
  .readout .clock{font-size:26px;letter-spacing:.08em;color:#eafcff}
  .readout .state{font-size:12px;letter-spacing:.3em;margin-top:4px}
  .readout .h{font-size:11px;color:var(--purple);letter-spacing:.16em;margin-top:2px}
  .state.flood{color:var(--cyan)} .state.ebb{color:var(--mag)} .state.slack{color:var(--amber)}
  .controls{bottom:108px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:18px;
    align-items:center;background:rgba(8,14,30,.6);border:1px solid rgba(25,246,255,.25);
    border-radius:10px;padding:9px 16px;backdrop-filter:blur(8px);font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;color:#9fc7ff}
  .controls label{display:flex;align-items:center;gap:8px;text-transform:uppercase}
  input[type=range]{width:120px;accent-color:var(--cyan)}
  button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;color:var(--mag);border:1px solid rgba(255,42,141,.4);border-radius:6px;
    padding:5px 9px;cursor:pointer;transition:.2s}
  button:hover{background:rgba(255,42,141,.12);color:#ff8ec0}
  .legend{position:fixed;bottom:16px;left:22px;z-index:7;font-family:var(--mono);font-size:9px;
    letter-spacing:.14em;color:#5e7fb0;line-height:1.7}
  .legend b{color:var(--cyan)} .legend i{color:var(--mag);font-style:normal}
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="hud title">
    <h1>VANCOUVER&nbsp;TIDAL&nbsp;GRID</h1>
    <div class="sub">STN&nbsp;7735&nbsp;·&nbsp;BURRARD&nbsp;INLET&nbsp;·&nbsp;49.29°N&nbsp;123.11°W</div>
    <div class="note">SIMULATED · MIXED SEMI-DIURNAL MODEL</div>
  </div>

  <div class="hud readout">
    <div class="clock" id="clock">00:00</div>
    <div class="state slack" id="state">SLACK</div>
    <div class="h" id="height">+0.0 m</div>
  </div>

  <div class="controls">
    <label>Speed <input id="speed" type="range" min="0.05" max="3" step="0.05" value="1"></label>
    <label>Labels <input id="labels" type="checkbox" checked></label>
    <button id="jump">▸ jump 6h</button>
  </div>

  <div class="legend">
    <div><b>━</b> coastline &nbsp; <i>▒</i> intertidal flats (exposed at low tide)</div>
    <div>particles drift with the current: <b>flood ▸ inland</b> · <i>ebb ◂ to the strait</i></div>
  </div>

  <div class="scan"></div><div class="vignette"></div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildParticles();}
addEventListener('resize',resize);

// ---- geography (normalized 0..1, y down). Stylised but recognisable. ----
const LAND=[
 {name:'NORTH SHORE',type:'mtn',label:[0.52,0.075],pts:[[0,0],[1,0],[1,.17],[.9,.2],[.79,.16],[.67,.22],[.54,.17],[.41,.23],[.29,.18],[.17,.24],[.06,.19],[0,.21]]},
 {name:'STANLEY PARK',type:'land',label:[0.205,0.345],pts:[[.13,.42],[.122,.35],[.16,.3],[.225,.285],[.30,.30],[.345,.34],[.40,.385],[.45,.425],[.452,.468],[.41,.475],[.35,.482],[.30,.468],[.25,.452],[.19,.448],[.15,.44]]},
 {name:'VANCOUVER',type:'land',label:[0.57,0.66],pts:[[.2,.525],[.31,.503],[.45,.502],[.5,.482],[.61,.462],[.73,.452],[.86,.46],[1,.44],[1,.83],[.85,.84],[.7,.825],[.55,.845],[.4,.832],[.28,.822],[.17,.8],[.115,.72],[.135,.62],[.18,.56]]},
 {name:'RICHMOND · DELTA',type:'land',label:[0.32,0.965],pts:[[0,.92],[.21,.9],[.46,.922],[.71,.9],[1,.918],[1,1],[0,1]]},
];
const WATER_LABELS=[
 {t:'BURRARD INLET',x:.6,y:.255,c:'cyan'},
 {t:'ENGLISH BAY',x:.085,y:.55,c:'mag'},
 {t:'FALSE CREEK',x:.5,y:.505,c:'cyan',s:.8},
 {t:'FRASER RIVER',x:.5,y:.868,c:'cyan'},
 {t:'STRAIT OF GEORGIA',x:.045,y:.30,c:'mag',s:.85},
];
const X=v=>v*W, Y=v=>v*H, MIN=()=>Math.min(W,H);

// ---- tide model: mixed semi-diurnal (two unequal highs/lows per day) ----
let simHours=4.0;                 // simulated time of day
const speed=document.getElementById('speed');
function tideAt(h){ // 0..1 normalised height, period ~ lunar day
  const w=2*Math.PI/12.42;        // principal semi-diurnal
  const a=0.34*Math.sin(w*h) + 0.16*Math.sin(w*h*0.97+1.1) + 0.07*Math.sin(2*w*h+0.4);
  return 0.5 + a;
}
function tideMetres(n){return (n-0.5)*5.0 + 2.6;} // map to ~0.1..5.1 m chart datum

// ---- particles (tidal current) ----
let P=[];
function buildParticles(){
  const n=Math.round(MIN()*0.34);
  P=[];for(let i=0;i<n;i++)P.push(newP(true));
}
function newP(spread){
  let x,y,tries=0;
  do{x=Math.random();y=Math.random();tries++;}while(inLand(x,y)&&tries<12);
  return{x,y,life:Math.random()*1,spd:0.4+Math.random()*0.9};
}
function inLand(x,y){for(const L of LAND)if(pip(x,y,L.pts))return true;return false;}
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){
  const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
  if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

// flood: current pushes inland (eastward + into inlets). ebb: reversed.
function currentVec(x,y,flow){
  // base eastward, curling north into Burrard Inlet up top, south near Fraser
  let ang = (y<.34)? -0.15 : (y>.8? 0.25 : 0.04);
  let vx=Math.cos(ang), vy=Math.sin(ang);
  return {vx:vx*flow, vy:vy*flow};
}

// ---- drawing helpers ----
function poly(pts,close=true){ctx.beginPath();pts.forEach((p,i)=>{const px=X(p[0]),py=Y(p[1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);});if(close)ctx.closePath();}
function neonStroke(col,w,blur){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.stroke();ctx.restore();}

let showLabels=true;
document.getElementById('labels').onchange=e=>showLabels=e.target.checked;
document.getElementById('jump').onclick=()=>simHours=(simHours+6)%24;

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  simHours=(simHours + dt*(+speed.value)*0.8 + 24)%24;
  const h=tideAt(simHours);
  const dh=tideAt(simHours+0.02)-tideAt(simHours-0.02); // slope → flood/ebb
  const flow=Math.max(-1,Math.min(1,dh*120));           // signed current strength

  // ---- water base ----
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04101f');g.addColorStop(.5,'#06142c');g.addColorStop(1,'#040a18');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // grid
  ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle='#0e3a55';ctx.lineWidth=1;
  const gs=MIN()/16;for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();

  // tidal current particles
  ctx.save();
  for(const p of P){
    const c=currentVec(p.x,p.y,flow);
    p.x+=c.vx*p.spd*dt*0.10; p.y+=c.vy*p.spd*dt*0.10; p.life-=dt*0.25;
    if(p.life<0||p.x<-.02||p.x>1.02||p.y<-.02||p.y>1.02||inLand(p.x,p.y)){Object.assign(p,newP());p.life=1;continue;}
    const a=Math.min(1,p.life)*0.6*Math.min(1,Math.abs(flow)+0.15);
    const col=flow>=0?'rgba(25,246,255,':'rgba(255,42,141,';
    const len=6+Math.abs(flow)*14;
    ctx.strokeStyle=col+a+')';ctx.lineWidth=1.4;ctx.beginPath();
    ctx.moveTo(X(p.x),Y(p.y));ctx.lineTo(X(p.x)-c.vx*len,Y(p.y)-c.vy*len);ctx.stroke();
  }
  ctx.restore();

  // ---- land + intertidal ----
  const flat=(1-h)*MIN()*0.018; // exposed-flat band width grows at low tide
  for(const L of LAND){
    // intertidal flats (thick dim stroke; inner half hidden by land fill)
    poly(L.pts);
    ctx.save();ctx.lineJoin='round';
    ctx.strokeStyle='rgba(122,92,160,'+(0.10+(1-h)*0.30)+')';
    ctx.lineWidth=3+flat;ctx.shadowColor='rgba(154,107,255,.5)';ctx.shadowBlur=10;ctx.stroke();ctx.restore();
    // land fill
    poly(L.pts);
    if(L.type==='mtn'){
      const lg=ctx.createLinearGradient(0,0,0,Y(.22));lg.addColorStop(0,'#0a0f1f');lg.addColorStop(1,'#10182e');
      ctx.fillStyle=lg;
    }else ctx.fillStyle='#0b1226';
    ctx.fill();
    // crisp neon coast
    poly(L.pts);neonStroke(L.type==='mtn'?'rgba(154,107,255,.85)':'rgba(25,246,255,.9)',1.6,12);
  }

  // mountain ridge ticks on north shore
  ctx.save();ctx.strokeStyle='rgba(154,107,255,.35)';ctx.lineWidth=1;
  for(let i=0;i<14;i++){const x=X(.06+i*.066),y0=Y(.02),y1=Y(.13+Math.sin(i*1.7)*.03);
    ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke();}ctx.restore();

  // ---- labels ----
  if(showLabels){
    ctx.save();ctx.textAlign='center';ctx.font='600 '+Math.max(9,MIN()*0.013)+'px ui-monospace,monospace';
    for(const L of LAND){ctx.fillStyle='rgba(180,225,255,.78)';ctx.shadowColor='#19f6ff';ctx.shadowBlur=6;
      ctx.fillText(L.name,X(L.label[0]),Y(L.label[1]));}
    for(const w of WATER_LABELS){const col=w.c==='mag'?'rgba(255,140,190,.7)':'rgba(120,235,255,.66)';
      ctx.fillStyle=col;ctx.shadowColor=w.c==='mag'?'#ff2a8d':'#19f6ff';ctx.shadowBlur=6;
      ctx.font='500 '+Math.max(8,MIN()*0.0115*(w.s||1))+'px ui-monospace,monospace';
      ctx.fillText(w.t,X(w.x),Y(w.y));}
    ctx.restore();
  }

  // ---- tide curve strip (bottom) ----
  drawTideStrip(simHours);

  // ---- HUD text ----
  document.getElementById('clock').textContent=fmt(simHours);
  const st=document.getElementById('state');
  const slack=Math.abs(flow)<0.12;
  st.textContent=slack?'SLACK WATER':(flow>0?'FLOOD ▸':'◂ EBB');
  st.className='state '+(slack?'slack':(flow>0?'flood':'ebb'));
  document.getElementById('height').textContent=(tideMetres(h)>=0?'+':'')+tideMetres(h).toFixed(1)+' m';

  requestAnimationFrame(frame);
}

function drawTideStrip(curH){
  const sh=84, y0=H-sh;
  ctx.save();
  ctx.fillStyle='rgba(4,9,20,.82)';ctx.fillRect(0,y0,W,sh);
  ctx.strokeStyle='rgba(25,246,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
  // 24h curve
  const pad=18, gw=W-pad*2, gh=sh-26, gy=y0+14;
  ctx.beginPath();
  for(let i=0;i<=gw;i++){const hh=(i/gw)*24;const v=tideAt(hh);
    const px=pad+i, py=gy+gh-(v*gh);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.strokeStyle='rgba(25,246,255,.5)';ctx.lineWidth=1.5;ctx.shadowColor='#19f6ff';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  // now marker
  const nx=pad+(curH/24)*gw, nv=tideAt(curH), ny=gy+gh-(nv*gh);
  ctx.strokeStyle='rgba(255,42,141,.6)';ctx.beginPath();ctx.moveTo(nx,gy-2);ctx.lineTo(nx,gy+gh+2);ctx.stroke();
  ctx.fillStyle='#ff2a8d';ctx.shadowColor='#ff2a8d';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(nx,ny,3.2,0,7);ctx.fill();ctx.shadowBlur=0;
  // hour ticks
  ctx.fillStyle='rgba(120,160,200,.55)';ctx.font='9px ui-monospace,monospace';ctx.textAlign='center';
  for(let hh=0;hh<=24;hh+=6){const tx=pad+(hh/24)*gw;ctx.fillText(String(hh).padStart(2,'0')+':00',tx,y0+sh-4);}
  ctx.textAlign='left';ctx.fillStyle='rgba(120,235,255,.6)';ctx.fillText('TIDE / 24H',pad,gy+8);
  ctx.restore();
}

function fmt(h){const hh=Math.floor(h),mm=Math.floor((h-hh)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}

resize();requestAnimationFrame(frame);
</script>
</body>
</html>
