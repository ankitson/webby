[package]
name = "webby"
version = "0.2.0"
edition = "2021"
description = "Drop a static HTML app into a local, tailnet, temporary public, or durable public URL."

[[bin]]
name = "webby"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "2"
