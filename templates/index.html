<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121311">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3">
  <style>
    :root {
      color-scheme: dark;
      background: #121311;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      background: #f7f6f3;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      background: #121311;
    }

    body {
      background: inherit;
    }
  </style>
  {{ chrome_head | safe }}
  <title>{{ title }}</title>
{{ preview_preloads | safe }}
  <style>
{% include "style.css" %}
  </style>
</head>
<body>
{{ chrome_body | safe }}
<main>
  <h1 class="sr-only">{{ title }}</h1>
{{ cards_html | safe }}
</main>
</body>
</html>
