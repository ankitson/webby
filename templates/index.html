<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
{% include "site-header.css" %}
{% include "style.css" %}
  </style>
</head>
<body>
{% include "site-header.html" %}
<main>
  <h1 class="sr-only">{{ title }}</h1>
  <webby-card-grid id="webby-grid" aria-label="Sites"></webby-card-grid>
  <script type="application/json" id="webby-card-data">{{ items_json | safe }}</script>
  <script type="module">
    import "./webby-card-grid.js";

    const data = document.getElementById("webby-card-data");
    document.getElementById("webby-grid").items = JSON.parse(data.textContent || "[]");
  </script>
</main>
</body>
</html>
