<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tools</title>
  <style>
{% include "style.css" %}
  </style>
</head>
<body>
<main>
  <h1 class="sr-only">tools</h1>
  <nav class="bag-nav">
    <a href="https://mini.ankitson.com">public</a>
    <a href="https://tools.home.ankitson.com">internal</a>
  </nav>
  <section class="grid" id="tools-grid" aria-label="Sites"></section>
  <template id="items">{% raw %}{{range .Items}}<article data-name="{{html .Name}}" data-isdir="{{.IsDir}}" data-url="{{html .URL}}"></article>{{end}}{% endraw %}</template>
  <script>
(function () {
  function hueFor(value) {
    var hash = 0;
    for (var i = 0; i < value.length; i++) {
      hash = ((hash * 31) + value.charCodeAt(i)) >>> 0;
    }
    return hash % 360;
  }

  function previewSlug(value) {
    return value.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
  }

  var tpl = document.getElementById('items').content;
  var toolsGrid = document.getElementById('tools-grid');
  for (var el of tpl.querySelectorAll('article')) {
    var raw = el.dataset.name;
    var isDir = el.dataset.isdir === 'true';
    var url = el.dataset.url;
    if (/^\./.test(raw)) continue;
    if (!isDir && !/\.html$/i.test(raw)) continue;
    var clean = raw.replace(/\/$/, '').replace(/\.html$/i, '');
    if (clean === 'index' || clean === 'browse') continue;
    var isTmp = /^tmp[-_]?/.test(clean);
    var display = isTmp ? (clean.replace(/^tmp[-_]?/, '') || clean) : clean;
    var hue = hueFor(clean);

    var preview = document.createElement('div');
    preview.className = 'preview';
    preview.setAttribute('aria-hidden', 'true');

    var previewLink = document.createElement('a');
    previewLink.className = 'preview-link';
    previewLink.href = url;
    previewLink.setAttribute('aria-label', 'Open ' + display);
    previewLink.appendChild(preview);

    var title = document.createElement('a');
    title.className = 'site-title';
    title.href = url;
    title.textContent = display;

    var caption = document.createElement('div');
    caption.className = 'site-caption';
    caption.appendChild(title);
    if (isTmp) {
      var label = document.createElement('span');
      label.className = 'temp-label';
      label.textContent = 'temp';
      caption.appendChild(label);
    }

    var tile = document.createElement('article');
    tile.className = 'site';
    tile.style.setProperty('--tile-hue', hue);
    tile.style.setProperty('--tile-shift', (hue + 72) % 360);
    tile.style.setProperty('--preview-image', "url('/.webby-previews/" + previewSlug(clean) + ".jpg')");
    tile.appendChild(previewLink);
    tile.appendChild(caption);
    toolsGrid.appendChild(tile);
  }
})();
  </script>
</main>
</body>
</html>
